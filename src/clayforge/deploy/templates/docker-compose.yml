# Minimal docker-compose for local prod-like testing of your ClayForge app
version: "3.8"

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - XAI_API_KEY=${XAI_API_KEY:-demo-key-for-local}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3
