# ClayForge on Railway — https://docs.railway.app
# Drop-in or use together with a Dockerfile.

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "uvicorn app:app --host 0.0.0.0 --port $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Health checks (optional but recommended)
# healthcheckPath = "/"
# healthcheckTimeout = 100

# Add your secrets in the Railway dashboard:
#   XAI_API_KEY = your_real_key
