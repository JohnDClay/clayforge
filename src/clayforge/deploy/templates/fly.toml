# ClayForge on Fly.io — https://fly.io/docs
# Usually paired with the included Dockerfile.

app = "your-app-name-here"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

# Secrets (never commit):
#   fly secrets set XAI_API_KEY=sk-...
